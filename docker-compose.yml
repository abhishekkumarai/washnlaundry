services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laundry_django_backend
    ports:
      - "8005:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - WHATSAPP_BRIDGE_URL=http://whatsapp-bridge:3000
      - WHATSAPP_BRIDGE_TOKEN=${WHATSAPP_BRIDGE_TOKEN:-laundry_secret_bridge_token}
      - WHATSAPP_DRY_RUN=${WHATSAPP_DRY_RUN:-1}
      - RAG_API_KEY=${RAG_API_KEY:-}
    depends_on:
      - whatsapp-bridge

  whatsapp-bridge:
    build:
      context: ./whatsapp-bridge
      dockerfile: Dockerfile
    container_name: laundry_whatsapp_bridge
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - PORT=3000
      - BRIDGE_TOKEN=${WHATSAPP_BRIDGE_TOKEN:-laundry_secret_bridge_token}
    volumes:
      - whatsapp_session:/app/session

  frontend:
    build:
      context: ./washnlaundrycrm
      dockerfile: Dockerfile
      args:
        # Empty by default — see the Dockerfile and CLAUDE.md "Authentication".
        # Set a real value in a .env file (docker compose reads it
        # automatically) to turn on Google Sign-In.
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: laundry_flutter_frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  whatsapp_session:
    name: washnlaundry_whatsapp_session
