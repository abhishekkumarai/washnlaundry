services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laundry_django_backend
    ports:
      - "8005:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - RAG_API_KEY=${RAG_API_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}

  frontend:
    build:
      context: ./washnlaundrycrm
      dockerfile: Dockerfile
      args:
        # Empty by default — see the Dockerfile and CLAUDE.md "Authentication".
        # Set a real value in a .env file (docker compose reads it
        # automatically) to turn on Google Sign-In.
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: laundry_flutter_frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
