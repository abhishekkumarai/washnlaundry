# Render Blueprint for the DEV backend only. Prod (`washnlaundry-backend`, branch
# main) is configured in the dashboard and is deliberately not managed here.
# Link this file via Render -> New -> Blueprint, branch `develop`.
services:
  - type: web
    name: washnlaundry-backend-dev
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/abhishekkumarai/washnlaundry
    branch: develop
    rootDir: crm/backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn laundry_backend.wsgi:application --bind 0.0.0.0:$PORT --timeout 120
    autoDeployTrigger: commit
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: washnlaundry-backend-dev.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://develop.washnlaundrycrm.pages.dev
      - key: APP_ORIGINS
        value: https://develop.washnlaundrycrm.pages.dev
      - key: APP_BASE_URL
        value: https://develop.washnlaundrycrm.pages.dev
      # Neon dev branch URL, never the prod database.
      - key: DJANGO_DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # RESEND_API_KEY, META_* and RAG_* are intentionally absent so dev cannot
      # email or message real people.
